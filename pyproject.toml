[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "reverseproof"
version = "0.2.0"
description = "Bounded behavioral evidence for local reverse engineering"
requires-python = ">=3.10"
[project.optional-dependencies]
local = ["mlx==0.32.3", "mlx-lm==0.32.0", "psutil==7.2.2"]
[project.scripts]
reverseproof = "reverseproof.cli:main"

[tool.setuptools.packages.find]
include = ["reverseproof*"]
